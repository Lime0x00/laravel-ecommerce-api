openapi: '3.0.3'
info:
  version: '1.0.0'
  title: 'E-Commerce REST API'
  description: |
    Strict headless REST API for an E-Commerce platform.
    This specification follows senior-grade engineering standards for pagination, 
    relational data, and automated security parsing.
    
    NOTE: All responses currently utilize a standardized envelope:
    { "status": "success", "message": "...", "data": { ... } }
  x-postman-event:
    - listen: test
      script:
        type: text/javascript
        exec:
          - 'const response = pm.response.json();'
          - ''
          - '// 1. Validate JSON Envelope'
          - "pm.test('Response has standard status field', () => {"
          - "    pm.expect(response).to.have.property('status');"
          - "    pm.expect(['success', 'error']).to.include(response.status);"
          - '});'
          - ''
          - "pm.test('Response has data field', () => {"
          - "    pm.expect(response).to.have.property('data');"
          - '});'
          - ''
          - '// 2. Automate JWT Token extraction'
          - 'if (response.data && response.data.access_token) {'
          - "    pm.environment.set('jwt_token', response.data.access_token);"
          - "    console.log('JWT Token updated in environment.');"
          - '}'
          - ''
          - '// 3. Validate HTTP Status'
          - "pm.test('Status code is 2xx', () => {"
          - '    pm.response.to.be.success;'
          - '});'

servers:
  - url: '{{baseUrl}}'
    description: Dynamic base URL using Postman variables

tags:
  - name: Authentication
    description: User registration, login, and token management.
  - name: Catalog
    description: Product discovery and category browsing.
  - name: Cart
    description: Managing shopping items.
  - name: Checkout
    description: Order processing and cart conversion.
  - name: Orders
    description: User order history.
  - name: Admin
    description: Management endpoints for products and orders.

paths:
  /auth/register:
    post:
      summary: Register a new user
      operationId: register
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
              example:
                status: success
                message: User registered successfully.
                data:
                  id: 1
                  name: John Doe
                  email: john@example.com
                  role: customer
                  created_at: '2026-05-02T14:00:00Z'
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      summary: Authenticate user
      operationId: login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                status: success
                data:
                  access_token: 'your-jwt-token-here'
                  token_type: bearer
                  expires_in: 3600
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/refresh:
    post:
      summary: Refresh JWT token
      operationId: refreshToken
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/profile:
    get:
      summary: Get user profile
      operationId: getProfile
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /products:
    get:
      summary: List all products
      operationId: getProducts
      tags: [Catalog]
      parameters:
        - name: page
          in: query
          schema: { $ref: '#/components/schemas/PageNumber' }
        - name: search
          in: query
          schema: { $ref: '#/components/schemas/SearchString' }
        - name: category
          in: query
          schema: { type: string, example: 'electronics' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
              example:
                status: success
                message: Products retrieved successfully.
                data:
                  current_page: 1
                  data:
                    - id: 39
                      category_id: 4
                      name: 'Headphones'
                      slug: 'headphones-pro'
                      price: "41.76"
                      stock: 89
                      category:
                        id: 4
                        name: 'Audio'
                        slug: 'audio'
                  total: 50
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      summary: Create new product (Admin)
      operationId: createProduct
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}:
    get:
      summary: Get single product details
      operationId: getProduct
      tags: [Catalog]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update product (Admin)
      operationId: updateProduct
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ResourceId' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Delete product (Admin)
      operationId: deleteProduct
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cart:
    get:
      summary: View current cart
      operationId: getCart
      tags: [Cart]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
              example:
                status: success
                message: 'Cart retrieved successfully.'
                data:
                  cart_id: 10
                  items: []
                  total: 0.0
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      summary: Clear current cart
      operationId: clearCart
      tags: [Cart]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /cart/{productId}:
    post:
      summary: Add to cart
      operationId: addToCart
      tags: [Cart]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ResourceId' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuantityRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
              example:
                status: success
                message: 'Cart item added successfully.'
                data:
                  cart_id: 10
                  items:
                    - product_id: 39
                      quantity: 1
                      unit_price: 41.76
                      subtotal: 41.76
                      product: { id: 39, name: 'Headphones', price: 41.76 }
                  total: 41.76
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      summary: Update cart item quantity
      operationId: updateCartQuantity
      tags: [Cart]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ResourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuantityRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
    delete:
      summary: Remove item from cart
      operationId: removeFromCart
      tags: [Cart]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }

  /orders:
    get:
      summary: List user order history
      operationId: getOrders
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { $ref: '#/components/schemas/PageNumber' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }

  /orders/{id}:
    get:
      summary: Get single order details
      operationId: getOrder
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/checkout:
    post:
      summary: Finalize checkout
      operationId: checkout
      tags: [Checkout]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/orders:
    get:
      summary: List all system orders (Admin)
      operationId: getAdminOrders
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { $ref: '#/components/schemas/PageNumber' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders/{id}/status:
    put:
      summary: Update order status (Admin)
      operationId: updateOrderStatus
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ResourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            message: 'Unauthenticated.'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            message: 'Access Denied.'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            message: 'Resource not found.'
    ValidationError:
      description: Validation Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            status: error
            message: 'Validation failed.'
    ServerError:
      description: Server Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ResourceId: { type: integer, minimum: 1, example: 1 }
    PageNumber: { type: integer, minimum: 1, default: 1, example: 1 }
    SearchString: { type: string, example: 'headphones' }
    StatusString: { type: string, example: success }
    MessageString: { type: string, nullable: true, example: 'Operation successful.' }
    EmailString: { type: string, format: email, example: 'john@example.com' }
    PasswordString: { type: string, minLength: 8, example: 'secret123456' }
    RoleString: { type: string, enum: [customer, admin], example: 'customer' }
    TokenString: { type: string, example: 'your-jwt-token-here' }
    TimestampString: { type: string, format: date-time, example: '2026-05-02T14:00:00Z' }
    PriceAmount: { type: string, example: "99.99" }
    CurrencyValue: { type: number, example: 99.99 }
    QuantityValue: { type: integer, minimum: 1, example: 1 }
    GenericName: { type: string, example: 'Wireless Headphones' }
    GenericSlug: { type: string, example: 'wireless-headphones' }
    OrderStatus: { type: string, example: 'pending' }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        last_page: { type: integer, example: 5 }
        per_page: { type: integer, example: 15 }
        total: { type: integer, example: 75 }
        first_page_url: { type: string, example: "http://localhost/api/products?page=1" }
        last_page_url: { type: string, example: "http://localhost/api/products?page=5" }
        next_page_url: { type: string, nullable: true, example: "http://localhost/api/products?page=2" }
        prev_page_url: { type: string, nullable: true }
        path: { type: string, example: "http://localhost/api/products" }
        from: { type: integer, example: 1 }
        to: { type: integer, example: 15 }

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { $ref: '#/components/schemas/GenericName' }
        email: { $ref: '#/components/schemas/EmailString' }
        password: { $ref: '#/components/schemas/PasswordString' }
        password_confirmation: { $ref: '#/components/schemas/PasswordString' }
        role: { $ref: '#/components/schemas/RoleString' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/EmailString' }
        password: { $ref: '#/components/schemas/PasswordString' }
        session_id: { type: string, nullable: true }

    LoginData:
      type: object
      properties:
        access_token: { $ref: '#/components/schemas/TokenString' }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 3600 }

    LoginResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        data: { $ref: '#/components/schemas/LoginData' }

    UserData:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        name: { type: string, example: 'John Doe' }
        email: { $ref: '#/components/schemas/EmailString' }
        role: { $ref: '#/components/schemas/RoleString' }
        created_at: { $ref: '#/components/schemas/TimestampString' }

    UserResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        data: { $ref: '#/components/schemas/UserData' }

    Category:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        name: { $ref: '#/components/schemas/GenericName' }
        slug: { $ref: '#/components/schemas/GenericSlug' }

    Product:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        category_id: { $ref: '#/components/schemas/ResourceId' }
        name: { $ref: '#/components/schemas/GenericName' }
        slug: { $ref: '#/components/schemas/GenericSlug' }
        description: { type: string }
        price: { $ref: '#/components/schemas/PriceAmount' }
        stock: { type: integer, example: 50 }
        category: { $ref: '#/components/schemas/Category' }

    ProductCollection:
      type: array
      items: { $ref: '#/components/schemas/Product' }

    ProductListResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        message: { $ref: '#/components/schemas/MessageString' }
        data:
          type: object
          properties:
            current_page: { type: integer, example: 1 }
            data: { $ref: '#/components/schemas/ProductCollection' }
            first_page_url: { type: string, example: "http://localhost/api/products?page=1" }
            from: { type: integer, example: 1 }
            last_page: { type: integer, example: 5 }
            last_page_url: { type: string, example: "http://localhost/api/products?page=5" }
            next_page_url: { type: string, nullable: true, example: "http://localhost/api/products?page=2" }
            path: { type: string, example: "http://localhost/api/products" }
            per_page: { type: integer, example: 15 }
            prev_page_url: { type: string, nullable: true }
            to: { type: integer, example: 15 }
            total: { type: integer, example: 75 }

    ProductResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        message: { $ref: '#/components/schemas/MessageString' }
        data: { $ref: '#/components/schemas/Product' }

    ProductCreateRequest:
      type: object
      required: [name, price, stock, category_id]
      properties:
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
        category_id: { type: integer }
        description: { type: string }

    ProductUpdateRequest:
      type: object
      properties:
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
        description: { type: string }

    CartProduct:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        name: { $ref: '#/components/schemas/GenericName' }
        slug: { $ref: '#/components/schemas/GenericSlug' }
        price: { $ref: '#/components/schemas/CurrencyValue' }
        category: { $ref: '#/components/schemas/Category' }

    CartItem:
      type: object
      properties:
        product_id: { $ref: '#/components/schemas/ResourceId' }
        quantity: { $ref: '#/components/schemas/QuantityValue' }
        unit_price: { $ref: '#/components/schemas/CurrencyValue' }
        subtotal: { $ref: '#/components/schemas/CurrencyValue' }
        product: { $ref: '#/components/schemas/CartProduct' }

    CartItemCollection:
      type: array
      items: { $ref: '#/components/schemas/CartItem' }

    CartData:
      type: object
      properties:
        cart_id: { type: integer, nullable: true, example: 10 }
        items: { $ref: '#/components/schemas/CartItemCollection' }
        total: { $ref: '#/components/schemas/CurrencyValue' }

    CartResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        message: { $ref: '#/components/schemas/MessageString' }
        data: { $ref: '#/components/schemas/CartData' }

    QuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { $ref: '#/components/schemas/QuantityValue' }

    OrderItem:
      type: object
      properties:
        product_id: { $ref: '#/components/schemas/ResourceId' }
        quantity: { $ref: '#/components/schemas/QuantityValue' }
        unit_price: { $ref: '#/components/schemas/CurrencyValue' }
        product: { $ref: '#/components/schemas/Product' }

    OrderItemCollection:
      type: array
      items: { $ref: '#/components/schemas/OrderItem' }

    OrderData:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        user_id: { $ref: '#/components/schemas/ResourceId' }
        total_price: { $ref: '#/components/schemas/CurrencyValue' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        shipping_address: { type: string, example: "123 Tech Lane" }
        payment_method: { type: string, example: "stripe" }
        payment_id: { type: string, nullable: true, example: "ch_123" }
        payment_status: { type: string, example: "completed" }
        items: { $ref: '#/components/schemas/OrderItemCollection' }
        created_at: { $ref: '#/components/schemas/TimestampString' }
        user: { $ref: '#/components/schemas/UserData' }

    OrderResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        message: { $ref: '#/components/schemas/MessageString' }
        data: { $ref: '#/components/schemas/OrderData' }

    OrderListResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        message: { $ref: '#/components/schemas/MessageString' }
        data:
          type: object
          properties:
            current_page: { type: integer, example: 1 }
            data: { type: array, items: { $ref: '#/components/schemas/OrderData' } }
            first_page_url: { type: string, example: "http://localhost/api/orders?page=1" }
            from: { type: integer, example: 1 }
            last_page: { type: integer, example: 5 }
            last_page_url: { type: string, example: "http://localhost/api/orders?page=5" }
            next_page_url: { type: string, nullable: true }
            path: { type: string, example: "http://localhost/api/orders" }
            per_page: { type: integer, example: 15 }
            prev_page_url: { type: string, nullable: true }
            to: { type: integer, example: 15 }
            total: { type: integer, example: 75 }

    CheckoutRequest:
      type: object
      required: [shipping_address, payment_method]
      properties:
        shipping_address: { type: string }
        payment_method: { type: string, enum: [stripe, paypal, cash] }
        payment_token: { type: string, nullable: true }
        payment_email: { type: string, format: email, nullable: true }

    GenericData:
      type: object
      nullable: true
      example: {}

    SuccessResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        message: { $ref: '#/components/schemas/MessageString' }
        data: { $ref: '#/components/schemas/GenericData' }

    ErrorResponse:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusString' }
        message: { $ref: '#/components/schemas/MessageString' }
        data: { type: object, nullable: true }
