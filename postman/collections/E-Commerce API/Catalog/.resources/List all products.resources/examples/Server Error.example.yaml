$kind: http-example
request:
  url: '{{baseUrl}}/products?page=1&search=headphones'
  method: GET
  headers:
    Accept: application/json
  queryParams:
    page: '1'
    search: headphones
  body:
    type: text
    content: ''
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "An unexpected error occurred."
      }
order: 2000
