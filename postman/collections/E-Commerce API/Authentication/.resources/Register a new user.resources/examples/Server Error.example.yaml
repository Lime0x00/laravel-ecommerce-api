$kind: http-example
request:
  url: '{{baseUrl}}/auth/register'
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "John Doe",
        "email": "john@example.com",
        "password": "secret123456",
        "role": "customer"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "An unexpected error occurred."
      }
order: 3000
