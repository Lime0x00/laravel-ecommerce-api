$kind: http-example
request:
  url: '{{baseUrl}}/auth/login'
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "admin@example.com",
        "password": "password123"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "Unauthenticated."
      }
order: 2000
