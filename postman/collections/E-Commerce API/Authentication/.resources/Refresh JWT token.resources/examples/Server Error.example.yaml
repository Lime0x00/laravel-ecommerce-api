$kind: http-example
request:
  url: '{{baseUrl}}/auth/refresh'
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
  body:
    type: text
    content: ''
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "An unexpected error occurred."
      }
order: 3000
