$kind: http-example
request:
  url: '{{baseUrl}}/cart/:product_id'
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    product_id: '1'
  body:
    type: json
    content: |-
      {
        "quantity": 1
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "message": "Cart updated.",
        "data": {}
      }
order: 1000
