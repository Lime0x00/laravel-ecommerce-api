$kind: http-example
request:
  url: '{{baseUrl}}/cart/:product_id'
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    product_id: '1'
  body:
    type: json
    content: |-
      {
        "quantity": 1
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "The given data was invalid.",
        "data": {
          "email": [
            "The email has already been taken."
          ]
        }
      }
order: 2000
