$kind: http-request
url: '{{baseUrl}}/cart/:product_id'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  product_id: '1'
body:
  type: json
  content: |-
    {
      "quantity": 1
    }
examples: ./.resources/Add to cart.resources/examples
order: 2000
