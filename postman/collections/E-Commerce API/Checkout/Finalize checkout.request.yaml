$kind: http-request
url: '{{baseUrl}}/orders/checkout'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "shipping_address": "123 Main St, Cairo",
      "payment_method": "visa"
    }
auth:
  type: bearer
  credentials:
    token: '{{bearerToken}}'
examples: ./.resources/Finalize checkout.resources/examples
order: 1000
