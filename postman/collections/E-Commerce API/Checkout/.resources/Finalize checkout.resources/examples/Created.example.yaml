$kind: http-example
request:
  url: '{{baseUrl}}/orders/checkout'
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
  body:
    type: text
    content: ''
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "data": {
          "id": 5001,
          "total_amount": 199.98,
          "status": "pending",
          "items": [
            {
              "product_name": "Wireless Headphones",
              "quantity": 2,
              "price": 99.99
            }
          ],
          "created_at": "2026-05-02T14:00:00Z"
        }
      }
order: 1000
