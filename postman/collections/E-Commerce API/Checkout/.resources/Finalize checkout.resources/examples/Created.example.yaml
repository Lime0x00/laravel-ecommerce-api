$kind: http-example
request:
  url: '{{baseUrl}}/orders/checkout'
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
  body:
    type: text
    content: |
      {
        "shipping_address": "123 Demo Street, City",
        "payment_method": "stripe",
        "payment_token": "tok_visa"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "success",
        "message": "Checkout completed successfully.",
        "data": {
          "id": 5001,
          "total_price": 199.98,
          "status": "pending",
          "items": [
            {
              "product_id": 1,
              "quantity": 2,
              "unit_price": 99.99,
              "product": {
                "id": 1,
                "name": "Wireless Headphones",
                "slug": "wireless-headphones",
                "price": 99.99,
                "category": {
                  "id": 2,
                  "name": "Audio",
                  "slug": "audio"
                }
              }
            }
          ],
          "created_at": "2026-05-02T14:00:00Z"
        }
      }
order: 1000
