$kind: http-example
request:
  url: '{{baseUrl}}/orders/checkout'
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
  body:
    type: text
    content: ''
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "The given data was invalid.",
        "data": {
          "email": [
            "The email has already been taken."
          ]
        }
      }
order: 2000
